<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="assets/favicon.ico" type="image/x-icon">
    <title>Formulário de inscrição</title>
</head>
<body>
    <main class="main">
    <section class="formulario">
        <h1>Formulário de inscrição</h1>
        <p>Preencha os dados abaixo para fazer sua incrição no Programa Trilhas</p>
        <div class="campo">
            <h3>Informação do participante</h3>
            <form>
                <label for="nome"> Nome Completo
                </label><br>
                <input type="text" id="nome" name="nome"> <br>
                <label for="data"> Data de Nascimento
                </label><br>
                <input type="date" id="data" name="data"> <br>
                <label for="cpf"> CPF
                </label><br>
                <input type="text" id="cpf" name="cpf"> <br>
                <label for="sexo"> Sexo
                </label><br>
                <select id="sexo" name="sexo">
                    <option value="masculino"> Masculino</option>
                    <option value="Feminino"> Feminino</option>
                </select><br>
                <label for="email"> E-mail
                </label><br>
                <input type="text" id="email" name="email"> <br>
                <label for="telefone"> Telefone
                </label><br>
                <input type="text" id="telefone" name="telefone"> <br>

                <input type="checkbox" name="termo" id="termo">
                <label for="termo">
                    Declaro que li e concordo com os 
                    <a href="termos_condicoes"> Termos e Condições</a>
                     e com a 
                     <a href="politica_privacidade"> Política de Privacidade</a> 
                </label>

                <div class="butoes">
                    <button type="reset" class="cancel">Cancelar</button>
                    <button type="submit" class="enviar">Fazer inscrição</button>
                </div>
            </form>
        </div>
    </section>

    <section class="imagem">
        <img src="assets/img/formulario.png" alt="Imagem">
    </section>
    </main>
</body>
</html>
