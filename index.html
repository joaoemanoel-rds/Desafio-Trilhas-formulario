<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="assets/favicon.ico" type="image/x-icon">
    <title>Formulário de inscrição</title>
</head>
<body>
    <main class="main">
        <div class="form_campo">
            <h1>Formulário de inscrição</h1>
            <p>Preencha os dados abaixo para fazer sua incrição no Programa Trilhas</p>
            <h3>Informação do participante</h3>
            <form>
                <label for="nome"> Nome Completo
                </label><br>
                <input type="text" id="nome" name="nome"> <br>
                <label for="data"> Data de Nascimento
                </label><br>
                <input type="date" id="data" name="data"> <span class="error-message">Data de Nascimento Inválida</span><br>
                <label for="cpf"> CPF
                </label><br>
                <input type="text" id="cpf" name="cpf" maxlength="14"> <span class="error-message">CPF Inválido</span><br>
                <label for="sexo"> Sexo
                </label><br>
                <select id="sexo" name="sexo">
                    <option value="masculino"> Masculino</option>
                    <option value="Feminino"> Feminino</option>
                </select><br>
                <label for="email"> E-mail
                </label><br>
                <input type="text" id="email" name="email"> <span class="error-message">Insira um E-mail válido</span><br>
                <label for="telefone"> Telefone
                </label><br>
                <input type="text" id="telefone" name="telefone"> <span class="error-message">Insira um número de telefone válido</span><br>

                <div class="termo">
                <input type="checkbox" name="termo" id="termo">
                <label for="termo">
                    Declaro que li e concordo com os 
                    <a href="termos_condicoes.html"> Termos e Condições</a>
                     e com a 
                     <a href="politica_privacidade.html"> Política de Privacidade</a> 
                </label>
                </div>
                <div class="butoes">
                    <button type="reset" class="cancel">Cancelar</button>
                    <button type="submit" class="enviar">Fazer inscrição</button>
                </div>
            </form>
        </div>
    <div class="img_campo">
        <div class="illustration">
            <img src="assets/Ilustration.png" alt="Imagem">
        </div>
        <div class="logo">
            <img src="assets/logo-trilhas-inova.png" alt="Imagem2">
        </div>
    </div>
    </main>
</body>
</html>
